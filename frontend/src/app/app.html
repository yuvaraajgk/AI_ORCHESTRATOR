<div class="frame">
  <div class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">IT Assistant</span>
    </div>
    <div class="session-meta">
      <span class="session-dot" aria-hidden="true"></span>
      <span>connected &middot; session <code>{{ sessionLabel }}</code></span>
    </div>
  </div>

  <div class="thread" #thread aria-label="Conversation" aria-live="polite">
    @for (msg of messages(); track $index) {
      <div class="msg" [class.msg--user]="msg.role === 'user'" [class.msg--assistant]="msg.role === 'assistant'">
        <div class="bubble" [innerHTML]="formatContent(msg.content)"></div>
        <div class="meta">{{ msg.role === 'user' ? 'You' : 'IT Assistant' }} &middot; {{ msg.time }}</div>
      </div>
    }

    @if (sending()) {
      <div class="msg msg--assistant">
        <div class="bubble typing-indicator" aria-label="IT Assistant is typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    }

    @if (errorMessage()) {
      <div class="msg msg--assistant">
        <div class="bubble bubble--error">{{ errorMessage() }}</div>
      </div>
    }
  </div>

  <form class="composer" aria-label="Send a message" (ngSubmit)="send()">
    <input
      class="composer__input"
      type="text"
      name="message"
      placeholder="Message IT Assistant&hellip;"
      aria-label="Message"
      autocomplete="off"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      [disabled]="sending()"
    />
    <button class="composer__send" type="submit" aria-label="Send message" [disabled]="sending() || !draft().trim()">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 10h13M10 3l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </form>
</div>
